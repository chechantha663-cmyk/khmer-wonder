<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>រឿងនិទាន និងហ្គេមពាក្យគន្លឹះ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.lead{margin:-10px 0 20px;color:var(--muted)}
.hidden{display:none!important}
.score{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#fff;border-radius:999px;font-weight:700;box-shadow:0 4px 12px rgba(40,20,80,.12)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card-btn{margin:0;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:18px;box-shadow:0 8px 20px rgba(40,20,80,.14);font-weight:700;animation:pop .5s ease both}
.card-btn:hover{background:#fff;filter:none;border-color:var(--accent2);transform:translateY(-4px) rotate(-1deg)}
.card-btn .pair{font-size:2.6rem;line-height:1.1}
.card-btn .stars{font-size:1rem;letter-spacing:2px}
.stage{--sky1:#8ed1ff;--sky2:#e3f5ff;--ground:#7bc96f;position:relative;height:280px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));box-shadow:inset 0 -6px 0 rgba(0,0,0,.05),0 16px 34px rgba(30,15,70,.3);transition:background .6s}
.stage.night{--sky1:#2a1d6a;--sky2:#7a5ab8;--ground:#3b6b4a}
.stage.sunset{--sky1:#ff9a62;--sky2:#ffe3b0;--ground:#c9a24d}
.stage.water{--sky1:#9fdcff;--sky2:#e9f8ff;--ground:#3a9bd6}
.stage.forest{--sky1:#8fd18f;--sky2:#e6f7d6;--ground:#4f9a4a}
.ground{position:absolute;left:0;right:0;bottom:0;height:42px;background:var(--ground);transition:background .6s}
.sunmoon{position:absolute;top:16px;right:22px;font-size:2.4rem;animation:float 4s ease-in-out infinite}
.char{position:absolute;bottom:30px;font-size:clamp(3.4rem,13vw,5.6rem);line-height:1;user-select:none;transform-origin:50% 100%}
#ca{left:14%;--dx:120px}#cb{right:14%;--dx:-120px}
#props{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:3rem;animation:float 2.6s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
.char.idle{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.03)}}
.char.jump{animation:jump .7s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-46px) rotate(-6deg)}}
.char.cheer{animation:cheer .5s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1.1)}50%{transform:translateY(-34px) scale(1.25) rotate(8deg)}}
.char.run{animation:dash 1.5s ease-in-out infinite}
@keyframes dash{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--dx)) rotate(4deg)}}
.char.walk{animation:walk 3.6s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(0) rotate(-3deg)}50%{transform:translateX(calc(var(--dx)*.6)) rotate(3deg)}}
.char.sleep{transform:rotate(80deg) translate(-4px,22px)}
.char.sleep::after{content:"💤";position:absolute;right:-10px;top:-36px;font-size:2rem;transform:rotate(-80deg);animation:float 1.6s ease-in-out infinite}
.char.shake{animation:shake .35s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-5deg)}75%{transform:translateX(8px) rotate(5deg)}}
.char.sad{transform:rotate(-14deg) translateY(10px);filter:grayscale(.6);animation:idle 4s ease-in-out infinite}
.char.grow{animation:grow 1.1s ease-in-out infinite alternate}
@keyframes grow{from{transform:scale(1)}to{transform:scale(1.35)}}
.narr{margin-top:16px;padding:18px 20px;background:rgba(255,255,255,.85);border-radius:16px;min-height:96px;font-size:1.15rem;line-height:1.9;animation:pop .4s ease}
mark{background:linear-gradient(120deg,#ffe07a,#ffc15e);color:var(--ink);padding:0 6px;border-radius:6px;font-weight:700}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctrl button{margin:0}
.alt{background:linear-gradient(120deg,var(--accent2),#4b3a9a)!important;box-shadow:0 8px 18px rgba(75,58,154,.35)!important}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:10px;height:10px;border-radius:50%;background:#d9d3e8;transition:background .3s,transform .3s}
.dots i.on{background:var(--accent);transform:scale(1.3)}
.qbox{margin-top:16px;padding:18px 20px;background:rgba(255,255,255,.88);border-radius:16px;animation:pop .4s ease}
.qbox h3{margin:0 0 6px;font-size:1.2rem}
.qnum{color:var(--accent2);font-weight:700;font-size:.9rem}
.qbox input{margin-top:8px}
.fb{min-height:1.8em;margin:8px 0 0;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--err)}
.poem p{margin:6px 0;font-size:1.2rem;font-weight:500;opacity:0;animation:line .6s ease forwards}
@keyframes line{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.big{font-size:2.2rem;text-align:center;margin:6px 0}
details{margin-top:14px}
summary{cursor:pointer;font-weight:700;color:var(--accent2)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.topnav{display:flex;gap:10px;flex-wrap:wrap}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.95rem}
.opts label{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}
.opts input{width:auto;min-height:0;margin:0;accent-color:var(--accent2)}
</style>
</head>
<body>
<div class="fx" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="bird b1"></div><div class="bird b2"></div><div id="sparks"></div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="page-shell">
<section class="demo-card" aria-labelledby="page-title">
  <div class="topbar">
    <p class="eyebrow">Story Lab · ពាក្យគន្លឹះ</p>
    <div class="topnav">
      <span class="score" id="score">⭐ 0</span>
      <a class="nav-btn back" href="fun.html"><span class="arrow">←</span> លេងជាមួយមិត្ត</a>
      <a class="nav-btn back" href="index.html"><span class="arrow">←</span> អនុគមន៍</a>
    </div>
  </div>
  <h2 id="page-title">📖 រឿងនិទាន ឆ្លើយសំណួរ ហ្គេមពាក្យគន្លឹះ</h2>

  <!-- បញ្ជីរឿង -->
  <div id="home">
    <p class="lead">ជ្រើសរឿងមួយ ស្តាប់និទាន រកពាក្យគន្លឹះ (ពាក្យពណ៌លឿង) ហើយឆ្លើយសំណួរដើម្បីទទួលផ្កាយ ⭐ រួចអានកំណាព្យសប្បាយៗ!</p>
    <div id="cards" class="cards"></div>
  </div>

  <!-- ទំព័រលេង -->
  <div id="play" class="hidden">
    <div id="stage" class="stage day" aria-live="polite">
      <div id="sun" class="sunmoon">☀️</div>
      <div id="props"></div>
      <div id="ca" class="char idle"></div>
      <div id="cb" class="char idle"></div>
      <div class="ground"></div>
    </div>

    <div id="story-box">
      <div id="narr" class="narr"></div>
      <div class="ctrl">
        <button type="button" onclick="prevScene()" class="alt">◀ ថយក្រោយ</button>
        <button type="button" onclick="readScene()" class="alt">🔊 អាន</button>
        <button type="button" onclick="nextScene()">បន្ទាប់ ▶</button>
        <div id="dots" class="dots"></div>
      </div>
    </div>

    <div id="quiz-box" class="qbox hidden">
      <span id="qnum" class="qnum"></span>
      <h3 id="qtext"></h3>
      <input id="qans" type="text" placeholder="វាយចម្លើយ (ប្រើពាក្យគន្លឹះ)..." autocomplete="off">
      <p id="fb" class="fb" role="status"></p>
      <div class="ctrl">
        <button type="button" onclick="checkAnswer()">✔ ឆ្លើយ</button>
        <button type="button" class="alt" onclick="showHint()">💡 ជំនួយ</button>
        <button type="button" class="alt" onclick="readQuestion()">🔊 អានសំណួរ</button>
        <button type="button" id="qnext" class="hidden" onclick="nextQuestion()">បន្ទាប់ ▶</button>
      </div>
    </div>

    <div id="poem-box" class="qbox poem hidden">
      <h3>🎶 កំណាព្យសប្បាយៗ</h3>
      <div id="poem-lines"></div>
      <div class="ctrl">
        <button type="button" class="alt" onclick="readPoem()">🔊 អានកំណាព្យ</button>
        <button type="button" onclick="finishStory()">បញ្ចប់ ▶</button>
      </div>
    </div>

    <div id="end-box" class="qbox hidden">
      <div class="big" id="end-stars"></div>
      <h3 id="end-title" style="text-align:center"></h3>
      <div class="ctrl" style="justify-content:center">
        <button type="button" onclick="nextStory()">រឿងបន្ទាប់ ▶</button>
        <button type="button" class="alt" onclick="openStory(curId)">↻ លេងម្តងទៀត</button>
        <button type="button" class="alt" onclick="goHome()">☰ បញ្ជីរឿង</button>
      </div>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="auto-read" checked> អានរឿងដោយស្វ័យប្រវត្តិ</label>
      <label><input type="checkbox" id="chime-toggle" checked> សំឡេងជួង</label>
      <label><input type="checkbox" id="confetti-toggle" checked> ផ្កាភ្លើងចាក់</label>
      <button type="button" class="alt" style="margin:0;padding:6px 14px" onclick="VoicePicker.stop()">⏹ ស្ងាត់</button>
    </div>
    <details>
      <summary>⚙ ការកំណត់សម្លេង</summary>
      <div id="voice-picker" class="voice-picker"></div>
      <p id="voice-note" class="voice-note" role="status"></p>
    </details>
  </div>
</section>
</main>

<script src="voice.js"></script>
<script>
// ===== ទិន្នន័យរឿង (ពាក្យក្នុង «...» ជាពាក្យគន្លឹះ) =====
const STORIES = [
 { id: "hare", title: "ទន្សាយនិងអណ្ដើក", chars: ["🐇", "🐢"],
  scenes: [
   { t: "ថ្ងៃមួយ ទន្សាយអួតថា ខ្ញុំរត់លឿនជាងគេនៅក្នុងព្រៃ!", a: "jump", b: "idle", mood: "day", props: "🌳" },
   { t: "«អណ្ដើក»ញញឹមហើយនិយាយថា ខ្ញុំសុំប្រណាំងជាមួយអ្នក។ ទន្សាយសើចឡូឡា!", a: "shake", b: "idle", mood: "day", props: "🏁" },
   { t: "ការប្រណាំងចាប់ផ្តើម! ទន្សាយរត់ទៅមុខយ៉ាងលឿន ឯអណ្ដើកដើរយឺតៗ។", a: "run", b: "walk", mood: "day", props: "💨" },
   { t: "ទន្សាយគិតថា ខ្ញុំនៅមុខឆ្ងាយ ទៅ«ដេកលក់»សិន! វាក៏ដេកនៅក្រោមដើមឈើ។", a: "sleep", b: "walk", mood: "sunset", props: "🌳" },
   { t: "អណ្ដើក«ព្យាយាម»ដើរមិនឈប់ ហើយដល់ទីបញ្ចប់មុនគេ! ទន្សាយភ្ញាក់មកឃើញ ក៏ខកចិត្តណាស់។", a: "sad", b: "cheer", mood: "sunset", props: "🏆" } ],
  quiz: [
   { q: "តើអ្នកណាឈ្នះការប្រណាំង?", keys: ["អណ្ដើក", "អណ្តើក"], hint: "សត្វដើរយឺតៗ មានសំបកនៅលើខ្នង", ans: "អណ្ដើក" },
   { q: "តើទន្សាយធ្វើអ្វី នៅពេលកំពុងប្រណាំង?", keys: ["ដេក", "គេង", "លក់"], hint: "វាគិតថាខ្លួននៅមុខឆ្ងាយ ហើយទៅ... ក្រោមដើមឈើ", ans: "ដេកលក់" },
   { q: "តើអណ្ដើកមានគុណសម្បត្តិអ្វី ដែលធ្វើឱ្យវាឈ្នះ?", keys: ["ព្យាយាម", "មិនឈប់", "អត់ធ្មត់"], hint: "វាដើរយឺត តែ... មិនឈប់", ans: "ព្យាយាម" } ],
  poem: ["ទន្សាយរត់លឿន តែគេងលក់ស្រួល", "អណ្ដើកដើរយឺត តែមិនឈប់ឡើយ", "ព្យាយាមបន្តិចៗ ដល់ទីក៏បាន", "អ្នកណាខ្ជិលគេង ចាញ់ហើយ ហាហា!"] },

 { id: "monkey", title: "ស្វានិងក្រពើ", chars: ["🐒", "🐊"],
  scenes: [
   { t: "ស្វាមួយរស់នៅលើ«ដើមឈើ» មាត់ទន្លេ ហើយចូលចិត្តចែកចេកឱ្យក្រពើ។", a: "jump", b: "idle", mood: "water", props: "🍌" },
   { t: "ក្រពើញ៉ាំចេកហើយ ក៏មានគំនិតអាក្រក់ ចង់ញ៉ាំ«បេះដូង»ស្វាទៀត!", a: "idle", b: "shake", mood: "water", props: "❤️" },
   { t: "ក្រពើនិយាយកុហកថា ឡើងខ្នងខ្ញុំ ខ្ញុំនាំទៅញ៉ាំផ្លែឈើឆ្ងាយ។ ស្វាក៏ឡើង។", a: "walk", b: "walk", mood: "water", props: "🌊" },
   { t: "កណ្ដាលទន្លេ ក្រពើប្រាប់ការពិត។ ស្វាភ័យណាស់ តែវាកំពុងគិត!", a: "shake", b: "idle", mood: "water", props: "😱" },
   { t: "ស្វាក៏«ឆ្លាត»ឆ្លើយថា ខ្ញុំទុកបេះដូងនៅលើដើមឈើ! ត្រឡប់ទៅយកសិន។ ដល់ច្រាំង ស្វាលោតរត់គេចភ្លាម!", a: "run", b: "sad", mood: "water", props: "🌴" } ],
  quiz: [
   { q: "តើក្រពើចង់ញ៉ាំអ្វីរបស់ស្វា?", keys: ["បេះដូង"], hint: "វាលោតដុកៗ នៅក្នុងទ្រូង", ans: "បេះដូង" },
   { q: "ស្វាកុហកថា ខ្លួនទុកបេះដូងនៅឯណា?", keys: ["ដើមឈើ", "លើដើម"], hint: "កន្លែងដែលស្វារស់នៅ", ans: "នៅលើដើមឈើ" },
   { q: "តើស្វាមានលក្ខណៈអ្វី ដែលជួយឱ្យវារួចខ្លួន?", keys: ["ឆ្លាត", "គំនិត", "ប៉ិនប្រសប់"], hint: "វាប្រើ... ដើម្បីរួចខ្លួន", ans: "ឆ្លាត" } ],
  poem: ["ស្វាឆ្លាតជាងក្រពើ", "ទុកបេះដូងលើដើមឈើ", "ក្រពើជឿភ្លាមៗ", "ស្វារត់បាត់ ហាហា!"] },

 { id: "lion", title: "សិង្ហនិងកណ្ដុរ", chars: ["🦁", "🐭"],
  scenes: [
   { t: "សិង្ហដេកលក់នៅក្នុងព្រៃ ស្រាប់តែកណ្ដុរតូចមួយរត់ឆ្លងកាត់ខ្នងវា។", a: "sleep", b: "run", mood: "forest", props: "🌿" },

let audioCtx = null;
function tone(f, s, d, type, v) {

  o.type = type || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v || 0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + d + 0.05);
}

  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  audioCtx = audioCtx || new AC(); if (audioCtx.state === "suspended") audioCtx.resume();
  if (ok) { tone(523, 0, .35); tone(659, .1, .35); tone(784, .2, .35); tone(1047, .32, .7, "sine", .13); }
  else { tone(220, 0, .25, "triangle", .15); tone(165, .12, .3, "triangle", .15); }
}

// ===== ផ្កាភ្លើងចាក់ =====
const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function sizeCv() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", sizeCv); sizeCv();
function burst() {
  if (!$("confetti-toggle").checked || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#e2552d", "#f08a3c", "#ffd36b", "#7b3fa0", "#4b8fe0", "#2fb37c", "#ff6fa5"];
  for (let i = 0; i < 90; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .4, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(function (p) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.max(0, 1 - p.life / 110); cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  parts = parts.filter(function (p) { return p.life < 110 && p.y < cv.height + 20; });
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if (!parts.length) cx.clearRect(0, 0, cv.width, cv.height);
}

  const q = story.quiz[qIdx], a = norm($("qans").value);

  }
  document.addEventListener("click", function (e) {
    const b = e.target.closest("button:not(.card-btn)"); if (!b) return;
    b.classList.add("ripple");
    const r = b.getBoundingClientRect(), size = Math.max(r.width, r.height) / 2, s = document.createElement("span");
    s.className = "r"; s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + (e.clientX - r.left - size / 2) + "px;top:" + (e.clientY - r.top - size / 2) + "px";
    b.appendChild(s); setTimeout(function () { s.remove(); }, 600);
  });
})();

renderHome();
</script>
</body>
</html>
